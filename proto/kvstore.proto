syntax = "proto3";

package ftkv.v1;

service KeyValueStore {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

service Raft {
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc GetStatus(NodeStatusRequest) returns (NodeStatusResponse);
}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  bool deleted = 1;
}

message RaftLogEntry {
  uint64 term = 1;
  bytes command = 2;
  bool is_no_op = 3;
}

message AppendEntriesRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 previous_log_index = 3;
  uint64 previous_log_term = 4;
  repeated RaftLogEntry entries = 5;
  uint64 leader_commit = 6;
  uint64 request_id = 7;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 conflict_index = 4;
  bool has_conflict_term = 5;
  uint64 conflict_term = 6;
  uint64 request_id = 7;
}

message RequestVoteRequest {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message NodeStatusRequest {}

enum NodeRole {
  NODE_ROLE_UNSPECIFIED = 0;
  NODE_ROLE_FOLLOWER = 1;
  NODE_ROLE_CANDIDATE = 2;
  NODE_ROLE_LEADER = 3;
}

message NodeStatusResponse {
  uint64 node_id = 1;
  NodeRole role = 2;
  uint64 current_term = 3;
  bool has_leader = 4;
  uint64 leader_id = 5;
  uint64 commit_index = 6;
  uint64 last_applied = 7;
  uint64 last_log_index = 8;
}
